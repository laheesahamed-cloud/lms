---
deployment:
  tasks:
    # Apex deploy: the SPA (landing + app + admin) is served straight from the
    # domain root, public_html/. The backend at public_html/api is NEVER
    # touched. The legacy public_html/lms folder is REMOVED so the app is not
    # served twice (apex + /lms); the built .htaccess 301-forwards /lms/* to /*.
    - export ROOTPATH=/home/xyndrome/public_html/
    # Clear stale build-managed folders at the apex root (keeps api/).
    - /bin/rm -rf $ROOTPATH/assets
    - /bin/rm -rf $ROOTPATH/brand
    - /bin/rm -rf $ROOTPATH/lms-assets
    - /bin/rm -rf $ROOTPATH/medical
    - /bin/rm -rf $ROOTPATH/offline
    - /bin/rm -rf $ROOTPATH/temp
    - /bin/rm -rf $ROOTPATH/download
    - /bin/rm -rf $ROOTPATH/landing
    - /bin/rm -rf $ROOTPATH/.well-known
    # Remove the old /lms subpath deploy so the app isn't duplicated there.
    - /bin/rm -rf $ROOTPATH/lms
    # Copy the entire built dist into the apex root, including dotfiles such as
    # .htaccess and the .well-known/ app-association files.
    - /bin/cp -R frontend/dist/. $ROOTPATH
    # Belt-and-suspenders: explicitly copy the dotfiles in case `cp -R dist/.`
    # skips them on this host, so the apex .htaccess (with the /lms 301 forward)
    # and the app-association files always land.
    - /bin/cp frontend/dist/.htaccess $ROOTPATH/.htaccess
    - /bin/cp -R frontend/dist/.well-known $ROOTPATH/.well-known
